events {
    worker_connections 1024;
}

http {
    # Upstream servers pointing to your public subdomains (HTTP)
    upstream auth_service {
        server auth.samirdev.site:80;
    }

    upstream core_service {
        server core.samirdev.site:443;
    }

    upstream scraper_service {
        server scraper.samirdev.site:80;
    }

    upstream notification_service {
        server notifications.samirdev.site:80;
    }

    upstream admin_service {
        server admin.samirdev.site:80;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name _;

        # Enable CORS - specify exact origin for credentials support
        add_header 'Access-Control-Allow-Origin' 'https://encheres-frontend.onrender.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Cron-Secret, X-Skip-Auth-Redirect' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Auth Service Routes
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service/api/v1/auth;
            proxy_set_header Host auth.samirdev.site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Core Service Routes - Sales
        location /api/v1/sales {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass https://core_service/api/v1/sales;
            proxy_set_header Host core.samirdev.site;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Core Service Routes - Lots
        location /api/v1/lots {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass https://core_service/api/v1/lots;
            proxy_set_header Host core.samirdev.site;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Core Service Routes - Favorites
        location /api/v1/favorites {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass https://core_service/api/v1/favorites;
            proxy_set_header Host core.samirdev.site;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Core Service Routes - Alerts
        location /api/v1/alerts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass https://core_service/api/v1/alerts;
            proxy_set_header Host core.samirdev.site;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Scraper Service Routes
        location /api/v1/scraper {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://scraper_service/api/v1/scraper;
            proxy_set_header Host scraper.samirdev.site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            # Pass through CRON_SECRET header
            proxy_set_header X-Cron-Secret $http_x_cron_secret;
        }

        # Notification Service Routes
        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service/api/v1/notifications;
            proxy_set_header Host notifications.samirdev.site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Core Service Routes - Media proxy
        location /api/v1/media {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass https://core_service/api/v1/media;
            proxy_set_header Host core.samirdev.site;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Admin Service Routes - Admin
        location /api/v1/admin {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://admin_service/api/v1/admin;
            proxy_set_header Host admin.samirdev.site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }

        # Admin Service Routes - Ingestion
        location /api/v1/ingestion {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://admin_service/api/v1/ingestion;
            proxy_set_header Host admin.samirdev.site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide CORS headers from backend to avoid duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            # Pass through CRON_SECRET header
            proxy_set_header X-Cron-Secret $http_x_cron_secret;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Gateway info
        location / {
            default_type application/json;
            return 200 '{"service":"api-gateway","version":"2.0.0","status":"running","deployment":"render","backend_services":{"auth":"auth.samirdev.site","core":"core.samirdev.site","scraper":"scraper.samirdev.site","notifications":"notifications.samirdev.site","admin":"admin.samirdev.site"},"routes":{"/api/v1/auth":"auth-service","/api/v1/sales":"core-service","/api/v1/lots":"core-service","/api/v1/favorites":"core-service","/api/v1/alerts":"core-service","/api/v1/scraper":"scraper-service","/api/v1/notifications":"notification-service","/api/v1/admin":"admin-service","/api/v1/ingestion":"admin-service"}}';
        }
    }
}
