events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8001;
    }

    upstream core_service {
        server core-service:8002;
    }

    upstream scraper_service {
        server scraper-service:8003;
    }

    upstream notification_service {
        server notification-service:8004;
    }

    upstream admin_service {
        server admin-service:8005;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name localhost;

        # Enable CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Auth Service Routes (Port 8001)
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core Service Routes (Port 8002)
        location /api/v1/sales {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_service/api/v1/sales;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/lots {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_service/api/v1/lots;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/favorites {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_service/api/v1/favorites;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/alerts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_service/api/v1/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Scraper Service Routes (Port 8003)
        location /api/v1/scraper {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://scraper_service/api/v1/scraper;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Notification Service Routes (Port 8004)
        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service/api/v1/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin Service Routes (Port 8005)
        location /api/v1/admin {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://admin_service/api/v1/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ingestion {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://admin_service/api/v1/ingestion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Gateway info
        location / {
            default_type application/json;
            return 200 '{"service":"api-gateway","version":"1.0.0","status":"running","routes":{"/api/v1/auth":"auth-service:8001","/api/v1/sales":"core-service:8002","/api/v1/lots":"core-service:8002","/api/v1/favorites":"core-service:8002","/api/v1/alerts":"core-service:8002","/api/v1/scraper":"scraper-service:8003","/api/v1/notifications":"notification-service:8004","/api/v1/admin":"admin-service:8005"}}';
        }
    }
}
