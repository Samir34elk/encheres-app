services:
  # PostgreSQL Database
  - type: pserv
    name: encheres-postgres
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/postgres/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: POSTGRES_USER
        value: encheres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: encheres

  # Redis for BullMQ
  - type: redis
    name: encheres-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru

  # Auth Service
  - type: web
    name: encheres-auth-service
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/auth-service/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com
    healthCheckPath: /health

  # Lots Service
  - type: web
    name: encheres-lots-service
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/lots-service/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com
    healthCheckPath: /health

  # Sales Service
  - type: web
    name: encheres-sales-service
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/sales-service/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com
    healthCheckPath: /health

  # Scraper Service (Background Worker)
  - type: web
    name: encheres-scraper-service
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/scraper-service/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: REDIS_URL
        fromService:
          name: encheres-redis
          type: redis
          property: connectionString
      - key: SALES_SERVICE_URL
        fromService:
          name: encheres-sales-service
          type: web
          property: host
      - key: LOTS_SERVICE_URL
        fromService:
          name: encheres-lots-service
          type: web
          property: host
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com
    healthCheckPath: /health

  # Notifications Service
  - type: web
    name: encheres-notifications-service
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/notifications-service/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@encheres.com
    healthCheckPath: /health

  # API Gateway
  - type: web
    name: encheres-api-gateway
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./microservices/api-gateway/Dockerfile
    dockerContext: ./microservices
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        fromService:
          name: encheres-auth-service
          type: web
          property: host
      - key: LOTS_SERVICE_URL
        fromService:
          name: encheres-lots-service
          type: web
          property: host
      - key: SALES_SERVICE_URL
        fromService:
          name: encheres-sales-service
          type: web
          property: host
      - key: SCRAPER_SERVICE_URL
        fromService:
          name: encheres-scraper-service
          type: web
          property: host
      - key: NOTIFICATIONS_SERVICE_URL
        fromService:
          name: encheres-notifications-service
          type: web
          property: host
      - key: CORS_ORIGIN
        value: https://encheres-domaine.onrender.com,http://localhost:5173
    healthCheckPath: /health
