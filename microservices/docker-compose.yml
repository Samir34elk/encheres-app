version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: encheres-postgres
    environment:
      POSTGRES_USER: encheres
      POSTGRES_PASSWORD: encheres_password
      POSTGRES_DB: encheres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - encheres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encheres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: encheres-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - encheres-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: encheres-auth
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://encheres:encheres_password@postgres:5432/encheres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encheres-network
    restart: unless-stopped

  # Lots Service
  lots-service:
    build:
      context: .
      dockerfile: lots-service/Dockerfile
    container_name: encheres-lots
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://encheres:encheres_password@postgres:5432/encheres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encheres-network
    restart: unless-stopped

  # Sales Service
  sales-service:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    container_name: encheres-sales
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://encheres:encheres_password@postgres:5432/encheres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encheres-network
    restart: unless-stopped

  # Scraper Service
  scraper-service:
    build:
      context: .
      dockerfile: scraper-service/Dockerfile
    container_name: encheres-scraper
    environment:
      - NODE_ENV=production
      - PORT=3004
      - REDIS_URL=redis://redis:6379
      - SALES_SERVICE_URL=http://sales-service:3003
      - LOTS_SERVICE_URL=http://lots-service:3002
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
      sales-service:
        condition: service_started
      lots-service:
        condition: service_started
    networks:
      - encheres-network
    restart: unless-stopped

  # Notifications Service
  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    container_name: encheres-notifications
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://encheres:encheres_password@postgres:5432/encheres
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CORS_ORIGIN=http://localhost:5173
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=noreply@encheres.com
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encheres-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: encheres-gateway
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOTS_SERVICE_URL=http://lots-service:3002
      - SALES_SERVICE_URL=http://sales-service:3003
      - SCRAPER_SERVICE_URL=http://scraper-service:3004
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3005
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - lots-service
      - sales-service
      - scraper-service
      - notifications-service
    networks:
      - encheres-network
    restart: unless-stopped

networks:
  encheres-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
