name: Scheduled Jobs

# This workflow triggers scheduled tasks for the auction platform
# Since Render Free tier instances sleep after 15 minutes of inactivity,
# we use GitHub Actions to trigger jobs externally via API

on:
  schedule:
    # Scraping job: every 15 minutes
    - cron: '*/15 * * * *'
    # Discovery job: daily at 3:00 AM UTC
    - cron: '0 3 * * *'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run?'
        required: true
        default: 'both'
        type: choice
        options:
          - scraping
          - discovery
          - both

env:
  BACKEND_URL: https://encheres-backend.onrender.com

jobs:
  scrape-sales:
    # Run this job only on the scraping schedule or manual trigger
    if: |
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'scraping' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraping worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/gha_scrape_and_ingest.py --mode scrape --max-sales 10

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Scraping worker failed. Check the logs above for details."

  discover-sales:
    # Run this job only on the discovery schedule or manual trigger
    if: |
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discovery' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run discovery worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/gha_scrape_and_ingest.py --mode discover --max-pages 5

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Discovery worker failed. Check the logs above for details."

  # Optional: Health check to wake up the Render instance
  wake-up:
    runs-on: ubuntu-latest
    # Run before the main jobs to wake up the instance
    if: github.event.schedule != ''

    steps:
      - name: Wake up Render instance
        run: |
          echo "Waking up Render instance..."
          curl -f "${{ env.BACKEND_URL }}/health" || echo "Instance might be sleeping, will retry in job"
          # Give it a moment to fully wake up
          sleep 5
