name: Scheduled Jobs

# This workflow triggers scheduled tasks for the auction platform
# Since Render Free tier instances sleep after 15 minutes of inactivity,
# we use GitHub Actions to trigger jobs externally via API

on:
  schedule:
    # Scraping job: every 15 minutes
    - cron: '*/15 * * * *'
    # Discovery job: daily at 3:00 AM UTC
    - cron: '0 3 * * *'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run?'
        required: true
        default: 'both'
        type: choice
        options:
          - scraping
          - discovery
          - both

env:
  BACKEND_URL: https://encheres-backend.onrender.com

jobs:
  scrape-sales:
    # Run this job only on the scraping schedule or manual trigger
    if: |
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'scraping' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Sales Scraping Job
        id: scraping
        run: |
          echo "Triggering scraping job..."
          response=$(curl -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s \
            "${{ env.BACKEND_URL }}/api/v1/scheduler/trigger-scraping")

          # Extract HTTP status code (last line)
          http_code=$(echo "$response" | tail -n1)
          # Extract response body (everything except last line)
          body=$(echo "$response" | head -n-1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Scraping job completed successfully"
            echo "response=$body" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ Scraping job failed with status $http_code"
            echo "Response: $body"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Scraping job failed. Check the logs above."
          # You can add webhook notifications here (Discord, Slack, etc.)

  discover-sales:
    # Run this job only on the discovery schedule or manual trigger
    if: |
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discovery' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Sales Discovery Job
        id: discovery
        run: |
          echo "Triggering discovery job..."
          response=$(curl -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s \
            "${{ env.BACKEND_URL }}/api/v1/scheduler/trigger-discovery")

          # Extract HTTP status code (last line)
          http_code=$(echo "$response" | tail -n1)
          # Extract response body (everything except last line)
          body=$(echo "$response" | head -n-1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Discovery job completed successfully"
            echo "response=$body" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ Discovery job failed with status $http_code"
            echo "Response: $body"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Discovery job failed. Check the logs above."
          # You can add webhook notifications here (Discord, Slack, etc.)

  # Optional: Health check to wake up the Render instance
  wake-up:
    runs-on: ubuntu-latest
    # Run before the main jobs to wake up the instance
    if: github.event.schedule != ''

    steps:
      - name: Wake up Render instance
        run: |
          echo "Waking up Render instance..."
          curl -f "${{ env.BACKEND_URL }}/health" || echo "Instance might be sleeping, will retry in job"
          # Give it a moment to fully wake up
          sleep 5
