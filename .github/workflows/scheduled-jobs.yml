name: Scheduled Jobs

on:
  schedule:
    - cron: '*/15 * * * *'  # Scraping every 15 minutes
    - cron: '0 3 * * *'     # Discovery at 3am
    - cron: '* * * * *'     # Price updates every minute
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run?'
        required: true
        default: 'both'
        type: choice
        options:
          - scraping
          - discovery
          - prices
          - both

env:
  BACKEND_URL: https://encheres-backend.onrender.com

jobs:
  prepare-sales:
    if: |
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'scraping' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sale_numbers: ${{ steps.export-sales.outputs.sale_numbers }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libgtk-3-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcb1 \
            libxrandr2 \
            libxdamage1 \
            libxcomposite1 \
            libasound2t64 \
            libatspi2.0-0 \
            libdbus-1-3 \
            libxext6 \
            libxfixes3

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Discover sales and export list
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/gha_scrape_and_ingest.py \
            --mode discover \
            --max-pages 5 \
            --max-sales 20 \
            --export-sales sale_numbers.json

      - name: Export sale matrix
        id: export-sales
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("sale_numbers.json")
          if not path.exists():
              print("sale_numbers=[]")
          else:
              numbers = json.loads(path.read_text())
              numbers = [int(n) for n in numbers]
              print(f"sale_numbers={json.dumps(numbers)}")
          PY

  scrape-sales:
    needs: prepare-sales
    if: |
      (github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'scraping' || github.event.inputs.job == 'both'))) &&
      needs.prepare-sales.outputs.sale_numbers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sale: ${{ fromJson(needs.prepare-sales.outputs.sale_numbers) }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libgtk-3-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcb1 \
            libxrandr2 \
            libxdamage1 \
            libxcomposite1 \
            libasound2t64 \
            libatspi2.0-0 \
            libdbus-1-3 \
            libxext6 \
            libxfixes3

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Scrape sale ${{ matrix.sale }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/gha_scrape_and_ingest.py \
            --mode scrape \
            --sale ${{ matrix.sale }} \
            --max-sales 1

  discover-sales:
    if: |
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discovery' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libgtk-3-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcb1 \
            libxrandr2 \
            libxdamage1 \
            libxcomposite1 \
            libasound2t64 \
            libatspi2.0-0 \
            libdbus-1-3 \
            libxext6 \
            libxfixes3

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Full discovery job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/gha_scrape_and_ingest.py \
            --mode discover \
            --max-pages 10 \
            --max-sales 50

  update-favorite-prices:
    if: |
      github.event.schedule == '* * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'prices' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scraper.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libgtk-3-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcb1 \
            libxrandr2 \
            libxdamage1 \
            libxcomposite1 \
            libasound2t64 \
            libatspi2.0-0 \
            libdbus-1-3 \
            libxext6 \
            libxfixes3

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Update favorite prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE_URL: ${{ env.BACKEND_URL }}/api/v1
        run: |
          python scripts/update_favorite_prices.py
