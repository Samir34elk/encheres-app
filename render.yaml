# Render Blueprint - Node.js/TypeScript Microservices
# Version 2 - Fixed Configuration
# Uses existing database: encheres-db (dpg-d3qns7vdiees73agmvcg-a)
# Uses existing Redis: encheres-redis (red-d3vck87diees73esn4a0)
#
# IMPORTANT: All Dockerfiles are in /microservices/ directory
# dockerContext MUST be ./microservices for COPY commands to work
#
# Build process fixed:
# - Prisma generate moved to runtime (CMD)
# - package-lock.json generated for all services
# - All TypeScript builds tested successfully

services:

  # Auth Service - JWT Authentication
  - type: web
    name: encheres-auth-service-v2
    env: docker
    dockerfilePath: ./microservices/auth-service/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com

  # Lots Service - Lots, Favorites, Alerts
  - type: web
    name: encheres-lots-service-v2
    env: docker
    dockerfilePath: ./microservices/lots-service/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com

  # Sales Service - Sales Management
  - type: web
    name: encheres-sales-service-v2
    env: docker
    dockerfilePath: ./microservices/sales-service/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com

  # Scraper Service - Web Scraping with Puppeteer + BullMQ
  - type: web
    name: encheres-scraper-service-v2
    env: docker
    dockerfilePath: ./microservices/scraper-service/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_URL
        sync: false  # Set manually in dashboard to Redis connection string
      - key: SALES_SERVICE_URL
        fromService:
          name: encheres-sales-service-v2
          type: web
          property: hostport
      - key: LOTS_SERVICE_URL
        fromService:
          name: encheres-lots-service-v2
          type: web
          property: hostport
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com

  # Notifications Service - Emails
  - type: web
    name: encheres-notifications-service-v2
    env: docker
    dockerfilePath: ./microservices/notifications-service/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@encheres.com

  # API Gateway - Reverse Proxy
  - type: web
    name: encheres-api-gateway-v2
    env: docker
    dockerfilePath: ./microservices/api-gateway/Dockerfile
    dockerContext: ./microservices
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        fromService:
          name: encheres-auth-service-v2
          type: web
          property: hostport
      - key: LOTS_SERVICE_URL
        fromService:
          name: encheres-lots-service-v2
          type: web
          property: hostport
      - key: SALES_SERVICE_URL
        fromService:
          name: encheres-sales-service-v2
          type: web
          property: hostport
      - key: SCRAPER_SERVICE_URL
        fromService:
          name: encheres-scraper-service-v2
          type: web
          property: hostport
      - key: NOTIFICATIONS_SERVICE_URL
        fromService:
          name: encheres-notifications-service-v2
          type: web
          property: hostport
      - key: CORS_ORIGIN
        value: https://encheres.onrender.com

  # Frontend - Static Site (React + Vite)
  - type: web
    name: encheres
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: yes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: encheres-api-gateway-v2
          type: web
          property: host

# Migration Notes:
# 1. Old Python services (encheres-auth-service, encheres-core-service, etc.) are replaced
# 2. New Node.js services have "-v2" suffix to avoid conflicts
# 3. After testing, delete old services from Render dashboard
# 4. Performance: Fastify is 3x faster than FastAPI
# 5. All services use Docker with multi-stage builds
# 6. Prisma ORM for type-safe database access
# 7. BullMQ + Redis for async scraping jobs
# 8. Health checks enabled on all services
# 9. Auto-deploy on git push to master branch
