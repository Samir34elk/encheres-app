# Render.com Blueprint - Auto-deployment configuration
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: encheres-db
    databaseName: encheres
    user: encheres_user
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  # Backend API
  - type: web
    name: encheres-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: encheres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: BACKEND_CORS_ORIGINS
        value: https://encheres-frontend.onrender.com
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: 5
      - key: DB_POOL_SIZE
        value: 10
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: DB_POOL_RECYCLE
        value: 3600

  # Frontend Static Site
  - type: web
    name: encheres-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://encheres-backend.onrender.com/api/v1
